<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A1 — Floating Label</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <form class="form">
    <div class="field">
      <!-- the empty placeholder makes :placeholder-shown usable as "the input is empty" -->
      <input type="text" id="email" name="email" placeholder=" " autocomplete="off">
      <label for="email">Email address</label>
    </div>

    <div class="field">
      <input type="text" id="company" name="company" placeholder=" " autocomplete="off">
      <label for="company">Company</label>
    </div>
  </form>

</body>
</html>
